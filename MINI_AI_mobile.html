<!doctype html>
<html lang="hy">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MINI AI</title>
<style>
:root {
  --bg:#111315; --panel:#1c1f23; --panel2:#24282d; --text:#f4f6f8;
  --muted:#aab1b8; --border:#343a40; --accent:#7c5cff;
}
* { box-sizing:border-box; }
body { margin:0; min-height:100vh; background:var(--bg); color:var(--text);
  font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif; }
.app { width:min(1100px,100%); margin:auto; min-height:100vh; display:flex; flex-direction:column; }
header { display:flex; align-items:center; gap:14px; padding:18px 20px; }
.logo { font-size:30px; font-weight:800; }
.actions { margin-left:auto; display:flex; gap:8px; }
button { border:1px solid var(--border); background:var(--panel2); color:var(--text);
  border-radius:12px; padding:10px 14px; cursor:pointer; font-weight:600; }
button:hover { border-color:#555d66; }
.chat { flex:1; padding:8px 20px 16px; overflow:auto; }
.msg { padding:14px 16px; margin:10px 0; border:1px solid var(--border);
  border-radius:16px; background:var(--panel); white-space:pre-wrap; }
.msg.you { background:#171a1e; }
.search { display:flex; gap:8px; padding:8px 20px; }
input { width:100%; border:1px solid var(--border); outline:none; border-radius:13px;
  background:var(--panel); color:var(--text); padding:13px 15px; font-size:16px; }
.quick { display:flex; gap:8px; overflow:auto; padding:6px 20px 10px; }
.quick button { white-space:nowrap; }
.bottom { display:flex; gap:8px; padding:10px 20px 20px; padding-bottom:max(20px,env(safe-area-inset-bottom)); }
.hint { color:var(--muted); font-size:13px; padding:0 20px 8px; }
@media (max-width:600px) {
  header { padding:14px; }
  .logo { font-size:25px; }
  .chat,.search,.quick,.bottom,.hint { padding-left:12px; padding-right:12px; }
  header button { padding:8px 10px; }
  .bottom { position:sticky; bottom:0; background:var(--bg); }
}
body.light { --bg:#f4f6f8; --panel:#fff; --panel2:#eef1f4; --text:#15171a;
  --muted:#66707a; --border:#d5d9de; --accent:#6346e8; }
</style>
</head>
<body>
<div class="app">
<header>
  <div class="logo">🤖 MINI AI</div>
  <div class="actions">
    <button onclick="newChat()">New Chat</button>
    <button onclick="toggleTheme()">Theme</button>
  </div>
</header>

<div id="chat" class="chat"></div>

<div class="hint">Գրիր կայքի անունը կամ հրաման, օրինակ՝ «բացիր Google»</div>
<div class="search">
  <input id="siteSearch" placeholder="🔎 Գտնել կայք..." autocomplete="off">
  <button onclick="findAndOpen()">Բացել</button>
</div>

<div class="quick">
  <button onclick="openSite('Google')">Google</button>
  <button onclick="openSite('YouTube')">YouTube</button>
  <button onclick="openSite('ChatGPT')">ChatGPT</button>
  <button onclick="openSite('GitHub')">GitHub</button>
  <button onclick="openSite('Instagram')">Instagram</button>
  <button onclick="openSite('Wikipedia')">Wikipedia</button>
</div>

<div class="bottom">
  <input id="message" placeholder="Բարև, գրիր ինձ ինչ կցանկանաս" autocomplete="off">
  <button onclick="send()">Ուղարկել</button>
</div>
</div>

const chat = document.getElementById("chat");
const message = document.getElementById("message");
const siteSearch = document.getElementById("siteSearch");

function addMessage(who, text, you=false) {
  const div = document.createElement("div");
  div.className = "msg" + (you ? " you" : "");
  div.textContent = who + ": " + text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

function normalize(s) {
  return s.toLowerCase().trim()
    .replace(/^բացիր\s+/,"")
    .replace(/^բացել\s+/,"")
    .replace(/^open\s+/,"");
}

function findSite(query) {
  const q = normalize(query);
  const names = Object.keys(SITES);
  const exact = names.find(n => n.toLowerCase() === q);
  if (exact) return exact;
  const partial = names.find(n => n.toLowerCase().includes(q) || q.includes(n.toLowerCase()));
  if (partial) return partial;

  // Simple fuzzy match.
  let best = null, bestScore = 0;
  for (const n of names) {
    const a = q, b = n.toLowerCase();
    let same = 0;
    for (const ch of new Set(a)) if (b.includes(ch)) same++;
    const score = same / Math.max(1, new Set(a).size);
    if (score > bestScore) { bestScore = score; best = n; }
  }
  return bestScore >= 0.55 ? best : null;
}

function openSite(name) {
  if (!SITES[name]) return;
  addMessage("MINI AI", "Բացում եմ " + name + " 🌐");
  window.open(SITES[name], "_blank", "noopener,noreferrer");
}

function findAndOpen() {
  const q = siteSearch.value.trim();
  if (!q) return;
  const site = findSite(q);
  if (site) openSite(site);
  else addMessage("MINI AI", "Այդ անունով կայք չգտա։ Փորձիր օրինակ՝ Google կամ YouTube։");
}

function send() {
  const q = message.value.trim();
  if (!q) return;
  message.value = "";
  addMessage("Դու", q, true);

  const low = q.toLowerCase();
  if (low.startsWith("բացիր ") || low.startsWith("բացել ") || low.startsWith("open ")) {
    const site = findSite(q);
    if (site) openSite(site);
    else addMessage("MINI AI", "Կայքը չգտա։");
  } else if (low.includes("քանի կայք")) {
    addMessage("MINI AI", "Իմ մեջ կա " + Object.keys(SITES).length + " կայք 🌐");
  } else if (low.includes("ժամ")) {
    addMessage("MINI AI", "Հիմա ժամը " + new Date().toLocaleTimeString("hy-AM") + " է։");
  } else if (low.includes("բարև") || low.includes("բարեւ") || low.includes("barev") || low.includes("hello")) {
    addMessage("MINI AI", "Բարև 👋 Գրիր ինձ ինչ կցանկանաս։");
  } else {
    addMessage("MINI AI", "Հասկացա 👍 Այս տարբերակում կարող եմ կայքեր գտնել ու բացել և կատարել պարզ հրամաններ։");
  }
}

function newChat() {
  chat.innerHTML = "";
  addMessage("MINI AI", "Բարև, գրիր ինձ ինչ կցանկանաս");
}

function toggleTheme() {
  document.body.classList.toggle("light");
}

message.addEventListener("keydown", e => { if (e.key === "Enter") send(); });
siteSearch.addEventListener("keydown", e => { if (e.key === "Enter") findAndOpen(); });

newChat();
</script>
